    <!-- Open Graph -->
    <meta property="og:title" content="Fagil Manday Library">
    <meta property="og:description" content="Browse our collection of books.">
    <meta property="og:image" content="images/logo.webp">
    <meta property="og:type" content="website">

    <link rel="icon" href="favicon.ico">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/larger.css">
    <link rel="stylesheet" href="css/modal.css">

    <script type="module" src="js/books.js" defer></script>

</head>

<body>

<header>

    <div class="logo-area">

        <img src="images/logo.webp"
            alt="Library Logo"
            width="60"
            height="60">

        <div>

            <h1>Fagil Manday Library</h1>

            <p>Read. Learn. Grow.</p>

        </div>

    </div>

    <button id="menu" aria-label="Navigation">
        ☰
    </button>

    <nav id="navMenu">

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="books.html" class="active">Books</a></li>

            <li><a href="contact.html">Contact</a></li>

        </ul>

    </nav>

</header>

<main>

<h2 class="center">Our Book Collection</h2>

<p class="center">
Browse our growing collection of books loaded dynamically from a JSON file.
</p>

<section class="controls">

<input
type="search"
id="search"
placeholder="Search books...">

<select id="category">

<option value="all">All Categories</option>

<option value="Classic">Classic</option>

<option value="Fantasy">Fantasy</option>

<option value="Business">Business</option>

<option value="Finance">Finance</option>

<option value="Programming">Programming</option>

<option value="Science Fiction">Science Fiction</option>

<option value="Inspirational">Inspirational</option>

<option value="Productivity">Productivity</option>

<option value="Romance">Romance</option>

<option value="Self Help">Self Help</option>

</select>

</section>

<section
id="bookContainer"
class="book-grid">

<!-- JavaScript loads books here -->

</section>

<dialog id="bookModal">

<div id="modalContent">

<!-- Dynamic content -->

</div>

<form method="dialog">

<button class="button">

Close

</button>

</form>

</dialog>

</main>

<footer>

<p>

</p>

<p id="lastModified"></p>

<p>

</a>

</p>
