<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Fagil Manday Library</title>

    <meta name="description"
        content="Contact Fagil Manday Library for book recommendations, questions, and support.">

    <meta name="author" content="Your Name">

    <!-- Open Graph -->
    <meta property="og:title" content="Contact Fagil Manday Library">
    <meta property="og:description" content="Send us your questions or suggestions.">
    <meta property="og:image" content="images/logo.webp">
    <meta property="og:type" content="website">

    <link rel="icon" href="favicon.ico">
    

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/larger.css">
    <link rel="stylesheet" href="css/forms.css">

    <script type="module" src="js/main.js" defer></script>

</head>

<body>

<header>

    <div class="logo-area">

        <img src="images/logo.webp"
            alt="Fagil Manday Library Logo"
            width="60"
            height="60">

        <div>

            <h1>Fagil Manday Library</h1>

            <p>Read. Learn. Grow.</p>

        </div>

    </div>

    <button id="menu" aria-label="Open Navigation">
        ☰
    </button>

    <nav id="navMenu">

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="books.html">Books</a></li>

            <li><a href="contact.html" class="active">Contact</a></li>

        </ul>

    </nav>

</header>

<main>

<section>

    <h2 class="center">Contact Us</h2>

    <p class="center">
        We'd love to hear from you. Fill out the form below.
    </p>

</section>

<form action="thankyou.html" method="get">

    <label for="fullname">
        Full Name
    </label>

    <input
        type="text"
        id="fullname"
        name="fullname"
        required
        minlength="3"
        autocomplete="name">

    <label for="email">
        Email Address
    </label>

    <input
        type="email"
        id="email"
        name="email"
        required
        autocomplete="email">

    <label for="phone">
        Phone Number
    </label>

    <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="+256..."
        autocomplete="tel">

    <label for="book">
        Favorite Book Category
    </label>

    <select id="book" name="book">

        <option value="Classic">Classic</option>

        <option value="Fantasy">Fantasy</option>

        <option value="Business">Business</option>

        <option value="Programming">Programming</option>

        <option value="Finance">Finance</option>

        <option value="Self Help">Self Help</option>

    </select>

    <label for="message">
        Message
    </label>

    <textarea
        id="message"
        name="message"
        required></textarea>

    <input
        type="submit"
        value="Send Message"
        class="button">

</form>

</main>

<footer>

<p>

&copy;

<span id="year"></span>

Fagil Manday Library

</p>

<p id="lastModified"></p>

<p>

<a href="attributions.html">

Attributions

</a>

|

<a href="#">

Project Video

</a>

</p>

</footer>

</body>

</html>
